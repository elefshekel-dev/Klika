# בונה את רסיסים ומפרסם דמו חי ל-GitHub Pages דרך הפריסה הרשמית של GitHub Actions.
# מפעיל את Pages אוטומטית (enablement) ומפרסם — בלי צורך לגעת בהגדרות ידנית.
# הכתובת שתתקבל: https://<user>.github.io/Klika/
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [claude/literary-fragments-pwa-86jq7d]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # מפעיל את Pages (build type = workflow) אם עוד לא מופעל, ומחזיר את נתיב הבסיס.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # בנייה עם נתיב בסיס תת-תיקייה כדי שהנכסים ייטענו תחת /Klika/.
      - run: npm run build
        env:
          VITE_BASE: /Klika/

      # נפילת SPA: כל נתיב לא-קיים יוגש כ-index.html (Pages לא עושה rewrite).
      - run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
